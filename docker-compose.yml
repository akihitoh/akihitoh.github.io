# ローカルプレビュー（Next.js 開発サーバー）。http://localhost:4001 で確認
services:
  web:
    image: node:24.22.0-alpine
    working_dir: /site
    volumes:
      - .:/site
      - node_modules:/site/node_modules
    ports:
      - "4001:4001"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 4001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  node_modules:
